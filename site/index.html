    <main id="app" data-pages="[{&quot;slug&quot;:&quot;wiki/analyses/bright-leaderboard-deep-dive-2026-08-16&quot;,&quot;title&quot;:&quot;BRIGHT Leaderboard Deep Dive&quot;,&quot;group&quot;:&quot;Wiki&quot;,&quot;section&quot;:&quot;wiki/analyses&quot;,&quot;markdown&quot;:&quot;\n# BRIGHT Leaderboard Deep Dive\n\n## Executive Read\n\nThe top BRIGHT systems are converging on the same lesson: reasoning-intensive retrieval is usually not fixed by a better embedding model alone. The winning pattern is **intent transformation before retrieval**, often plus reasoning-tuned dense embeddings and reranking/fusion.\n\nMira and INF-X are especially interesting because they push query alignment hard and avoid heavyweight reranking in the described pipeline. NVIDIA, DIVER, and BGE-Reasoner are more pipeline-heavy: they use agent loops, query expansion, reranking, fusion, or multi-model ensembles to recover recall and improve top-10 ordering.\n\n## Leaderboard Snapshot\n\n| Method | Short Score | Basic Shape | Main Caveat |\n|---|---:|---|---|\n| Mira-Reasoning-Retrieval | 66.9 | MQR-A1 query rewriter + MRE-T1 dense retriever | Mostly self-authored docs/model cards, not a method paper found in this pass |\n| INF-X-Retriever | 63.4 | RL-tuned query aligner + dense retriever | No formal paper found; limited training detail |\n| RakanEmbed4B | 52.4 | INF-style query rewrite + 4B dense retriever | Least verifiable; no paper/model card found |\n| NVIDIA NeMo Agentic Retrieval | 50.9 | reasoning retriever + Claude Opus 4.5 ReAct retrieval loop | Cost/latency/reproducibility caveats |\n| DIVER-v3-GroupRank | 46.8 | preprocessing + query expansion + dense/BM25 + pointwise/listwise reranking | Multi-stage pipeline makes attribution hard |\n| BGE-Reasoner-0928 | 46.4 | rewriter + embedder + BM25 + multi-size reranker fusion | Pipeline score should not be attributed to embedder alone |\n\n## How The Leaders Achieve It\n\n### Mira-Reasoning-Retrieval\n\nMira combines `MQR-A1`, a query rewriter, with `MRE-T1`, a reasoning-oriented dense retriever. The public description says MQR-A1 uses candidate rewrite mining, supervised cold start, then GRPO alignment against retrieval feedback. Its reward includes dense retrieval nDCG, a length penalty, and cosine similarity to positives. The main idea is to distill retrieval intent and suppress misleading surface-level noise before embedding.\n\nWhy this likely works: BRIGHT queries often contain verbose or misleading surface features. A rewriter optimized against retrieval feedback can produce a cleaner query representation than generic expansion.\n\nCaveat: the strongest claims come from project/model-card material rather than a peer-reviewed method paper found in this pass.\n\n### INF-X-Retriever\n\nINF-X uses a query aligner plus dense retriever. Its public docs explicitly reject common add-ons: no reranker, no HyDE, no BM25 fusion, no multi-query expansion, no ensembles. The query aligner is Qwen2.5-7B-Instruct based and RL-tuned to distill core retrieval intent; the retriever is `inf-retriever-v1-pro` with targeted long-query adaptation.\n\nWhy this likely works: it removes query noise while keeping the runtime path simple. For BRIGHT, that means the dense retriever sees the underlying information need instead of the messy original phrasing.\n\nCaveat: documentation is mostly project/repo/model-card based. Exact training data details are limited.\n\n### RakanEmbed4B\n\nRakanEmbed is a 4B dense retrieval model. Its production pipeline first uses an INF-X-based query rewriter, then retrieves with RakanEmbed. The official page claims single-forward-pass retrieval, no iterative retrieval loop, and sub-second embedding inference. It reports training on a single RTX 3060 Ti using Unsloth&#39;s embedding fine-tuning pipeline.\n\nWhy this likely works: it borrows the same query-intent cleanup pattern as INF-X and pairs it with a reasoning-tuned retriever.\n\nCaveat: public detail is thin; this is the least independently verifiable top method in the pass.\n\n### NVIDIA NeMo Retriever Agentic Retrieval\n\nNVIDIA combines `llama-nv-embed-reasoning-3b`, a LLaMA-3.2-3B-based dense retriever trained with InfoNCE on synthetic reasoning-intensive pairs, with a Claude Opus 4.5 ReAct retrieval loop. The agent uses tools such as `think`, `retrieve(query, top_k)`, and `final_results`, iteratively decomposing and rephrasing queries. If the loop hits a limit, it falls back to reciprocal rank fusion over retrieval attempts.\n\nWhy this likely works: it makes retrieval itself agentic. The system can try multiple search framings, inspect whether the results look useful, and converge on final documents.\n\nCaveat: the agentic loop is likely slower and more expensive than single-stage systems, and it depends on a commercial LLM.\n\n### DIVER-v3-GroupRank\n\nDIVER is a multi-stage reasoning-intensive retrieval pipeline: document preprocessing, iterative query expansion, dense retrieval with a reasoning-tuned model, BM25 combination, and pointwise/listwise reranking. The paper reports 46.8 overall nDCG@10 on BRIGHT and 31.9 on original queries.\n\nWhy this likely works: it attacks several failure modes: noisy documents, underspecified queries, dense retrieval blind spots, lexical retrieval blind spots, and local reranker mistakes.\n\nCaveat: because many stages contribute, it is harder to know which component is responsible for the gain.\n\n### BGE-Reasoner-0928\n\nBGE-Reasoner is an end-to-end pipeline with a rewriter, embedder, and reranker. The rewriter generates five rewritten queries. For each rewrite, BM25 and BGE-Reasoner-Embed retrieve top-2000 documents. The system reranks top-100 candidates with Qwen3 8B, 14B, and 32B rerankers, then fuses six reranked lists plus one hybrid BM25/embed list.\n\nWhy this likely works: broad query diversification improves recall; dense+BM25 fusion catches complementary evidence; multi-size reranker fusion improves final top-10 ordering.\n\nCaveat: the 46.4 score is a pipeline score. The standalone embedder is reported around 37-38 depending on variant/setup, so do not attribute the full score to embeddings alone.\n\n## Lessons For ACE\n\nBRIGHT suggests an ACE retrieval playbook should focus on:\n\n- Query intent distillation.\n- Avoiding semantic traps.\n- Choosing when to use single-stage retrieval versus agentic multi-query search.\n- Recording failed query framings as negative lessons.\n- Preserving exact search observations for later audit and recall.\n\nThis is a strong candidate evaluation setting for an ACE+ACM+ARC hybrid: ACE learns retrieval strategies, ACM governs long search context, and ARC preserves exact observations.\n\n## Research Gaps\n\n- No ACE/ACM/ARC paper reports BRIGHT results yet.\n- Leaderboard metadata has some inconsistencies, especially around long-document metric/date labels.\n- Several high-scoring methods rely on self-reported project pages rather than papers.\n- Public training-data detail varies significantly across leaders.\n\n&quot;,&quot;html&quot;:&quot;&lt;h1&gt;BRIGHT Leaderboard Deep Dive&lt;/h1&gt;\n&lt;h2&gt;Executive Read&lt;/h2&gt;\n&lt;p&gt;The top BRIGHT systems are converging on the same lesson: reasoning-intensive retrieval is usually not fixed by a better embedding model alone. The winning pattern is &lt;strong&gt;intent transformation before retrieval&lt;/strong&gt;, often plus reasoning-tuned dense embeddings and reranking/fusion.&lt;/p&gt;\n&lt;p&gt;Mira and INF-X are especially interesting because they push query alignment hard and avoid heavyweight reranking in the described pipeline. NVIDIA, DIVER, and BGE-Reasoner are more pipeline-heavy: they use agent loops, query expansion, reranking, fusion, or multi-model ensembles to recover recall and improve top-10 ordering.&lt;/p&gt;\n&lt;h2&gt;Leaderboard Snapshot&lt;/h2&gt;\n&lt;p&gt;| Method | Short Score | Basic Shape | Main Caveat |&lt;/p&gt;\n&lt;p&gt;|---|---:|---|---|&lt;/p&gt;\n&lt;p&gt;| Mira-Reasoning-Retrieval | 66.9 | MQR-A1 query rewriter + MRE-T1 dense retriever | Mostly self-authored docs/model cards, not a method paper found in this pass |&lt;/p&gt;\n&lt;p&gt;| INF-X-Retriever | 63.4 | RL-tuned query aligner + dense retriever | No formal paper found; limited training detail |&lt;/p&gt;\n&lt;p&gt;| RakanEmbed4B | 52.4 | INF-style query rewrite + 4B dense retriever | Least verifiable; no paper/model card found |&lt;/p&gt;\n&lt;p&gt;| NVIDIA NeMo Agentic Retrieval | 50.9 | reasoning retriever + Claude Opus 4.5 ReAct retrieval loop | Cost/latency/reproducibility caveats |&lt;/p&gt;\n&lt;p&gt;| DIVER-v3-GroupRank | 46.8 | preprocessing + query expansion + dense/BM25 + pointwise/listwise reranking | Multi-stage pipeline makes attribution hard |&lt;/p&gt;\n&lt;p&gt;| BGE-Reasoner-0928 | 46.4 | rewriter + embedder + BM25 + multi-size reranker fusion | Pipeline score should not be attributed to embedder alone |&lt;/p&gt;\n&lt;h2&gt;How The Leaders Achieve It&lt;/h2&gt;\n&lt;h3&gt;Mira-Reasoning-Retrieval&lt;/h3&gt;\n&lt;p&gt;Mira combines &lt;code&gt;MQR-A1&lt;/code&gt;, a query rewriter, with &lt;code&gt;MRE-T1&lt;/code&gt;, a reasoning-oriented dense retriever. The public description says MQR-A1 uses candidate rewrite mining, supervised cold start, then GRPO alignment against retrieval feedback. Its reward includes dense retrieval nDCG, a length penalty, and cosine similarity to positives. The main idea is to distill retrieval intent and suppress misleading surface-level noise before embedding.&lt;/p&gt;\n&lt;p&gt;Why this likely works: BRIGHT queries often contain verbose or misleading surface features. A rewriter optimized against retrieval feedback can produce a cleaner query representation than generic expansion.&lt;/p&gt;\n&lt;p&gt;Caveat: the strongest claims come from project/model-card material rather than a peer-reviewed method paper found in this pass.&lt;/p&gt;\n&lt;h3&gt;INF-X-Retriever&lt;/h3&gt;\n&lt;p&gt;INF-X uses a query aligner plus dense retriever. Its public docs explicitly reject common add-ons: no reranker, no HyDE, no BM25 fusion, no multi-query expansion, no ensembles. The query aligner is Qwen2.5-7B-Instruct based and RL-tuned to distill core retrieval intent; the retriever is &lt;code&gt;inf-retriever-v1-pro&lt;/code&gt; with targeted long-query adaptation.&lt;/p&gt;\n&lt;p&gt;Why this likely works: it removes query noise while keeping the runtime path simple. For BRIGHT, that means the dense retriever sees the underlying information need instead of the messy original phrasing.&lt;/p&gt;\n&lt;p&gt;Caveat: documentation is mostly project/repo/model-card based. Exact training data details are limited.&lt;/p&gt;\n&lt;h3&gt;RakanEmbed4B&lt;/h3&gt;\n&lt;p&gt;RakanEmbed is a 4B dense retrieval model. Its production pipeline first uses an INF-X-based query rewriter, then retrieves with RakanEmbed. The official page claims single-forward-pass retrieval, no iterative retrieval loop, and sub-second embedding inference. It reports training on a single RTX 3060 Ti using Unsloth&amp;#39;s embedding fine-tuning pipeline.&lt;/p&gt;\n&lt;p&gt;Why this likely works: it borrows the same query-intent cleanup pattern as INF-X and pairs it with a reasoning-tuned retriever.&lt;/p&gt;\n&lt;p&gt;Caveat: public detail is thin; this is the least independently verifiable top method in the pass.&lt;/p&gt;\n&lt;h3&gt;NVIDIA NeMo Retriever Agentic Retrieval&lt;/h3&gt;\n&lt;p&gt;NVIDIA combines &lt;code&gt;llama-nv-embed-reasoning-3b&lt;/code&gt;, a LLaMA-3.2-3B-based dense retriever trained with InfoNCE on synthetic reasoning-intensive pairs, with a Claude Opus 4.5 ReAct retrieval loop. The agent uses tools such as &lt;code&gt;think&lt;/code&gt;, &lt;code&gt;retrieve(query, top_k)&lt;/code&gt;, and &lt;code&gt;final_results&lt;/code&gt;, iteratively decomposing and rephrasing queries. If the loop hits a limit, it falls back to reciprocal rank fusion over retrieval attempts.&lt;/p&gt;\n&lt;p&gt;Why this likely works: it makes retrieval itself agentic. The system can try multiple search framings, inspect whether the results look useful, and converge on final documents.&lt;/p&gt;\n&lt;p&gt;Caveat: the agentic loop is likely slower and more expensive than single-stage systems, and it depends on a commercial LLM.&lt;/p&gt;\n&lt;h3&gt;DIVER-v3-GroupRank&lt;/h3&gt;\n&lt;p&gt;DIVER is a multi-stage reasoning-intensive retrieval pipeline: document preprocessing, iterative query expansion, dense retrieval with a reasoning-tuned model, BM25 combination, and pointwise/listwise reranking. The paper reports 46.8 overall nDCG@10 on BRIGHT and 31.9 on original queries.&lt;/p&gt;\n&lt;p&gt;Why this likely works: it attacks several failure modes: noisy documents, underspecified queries, dense retrieval blind spots, lexical retrieval blind spots, and local reranker mistakes.&lt;/p&gt;\n&lt;p&gt;Caveat: because many stages contribute, it is harder to know which component is responsible for the gain.&lt;/p&gt;\n&lt;h3&gt;BGE-Reasoner-0928&lt;/h3&gt;\n&lt;p&gt;BGE-Reasoner is an end-to-end pipeline with a rewriter, embedder, and reranker. The rewriter generates five rewritten queries. For each rewrite, BM25 and BGE-Reasoner-Embed retrieve top-2000 documents. The system reranks top-100 candidates with Qwen3 8B, 14B, and 32B rerankers, then fuses six reranked lists plus one hybrid BM25/embed list.&lt;/p&gt;\n&lt;p&gt;Why this likely works: broad query diversification improves recall; dense+BM25 fusion catches complementary evidence; multi-size reranker fusion improves final top-10 ordering.&lt;/p&gt;\n&lt;p&gt;Caveat: the 46.4 score is a pipeline score. The standalone embedder is reported around 37-38 depending on variant/setup, so do not attribute the full score to embeddings alone.&lt;/p&gt;\n&lt;h2&gt;Lessons For ACE&lt;/h2&gt;\n&lt;p&gt;BRIGHT suggests an ACE retrieval playbook should focus on:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Query intent distillation.&lt;/li&gt;\n&lt;li&gt;Avoiding semantic traps.&lt;/li&gt;\n&lt;li&gt;Choosing when to use single-stage retrieval versus agentic multi-query search.&lt;/li&gt;\n&lt;li&gt;Recording failed query framings as negative lessons.&lt;/li&gt;\n&lt;li&gt;Preserving exact search observations for later audit and recall.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;This is a strong candidate evaluation setting for an ACE+ACM+ARC hybrid: ACE learns retrieval strategies, ACM governs long search context, and ARC preserves exact observations.&lt;/p&gt;\n&lt;h2&gt;Research Gaps&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;No ACE/ACM/ARC paper reports BRIGHT results yet.&lt;/li&gt;\n&lt;li&gt;Leaderboard metadata has some inconsistencies, especially around long-document metric/date labels.&lt;/li&gt;\n&lt;li&gt;Several high-scoring methods rely on self-reported project pages rather than papers.&lt;/li&gt;\n&lt;li&gt;Public training-data detail varies significantly across leaders.&lt;/li&gt;\n&lt;/ul&gt;&quot;},{&quot;slug&quot;:&quot;wiki/analyses/initial-synthesis-2026-08-16&quot;,&quot;title&quot;:&quot;Initial ACE Context Synthesis&quot;,&quot;group&quot;:&quot;Wiki&quot;,&quot;section&quot;:&quot;wiki/analyses&quot;,&quot;markdown&quot;:&quot;\n# Initial Synthesis\n\nThe three seed papers line up into a useful stack:\n\n- ACE is about **learning durable playbook content**.\n- ACM is about **agent-controlled transcript lifecycle**.\n- ARC is about **exact recall after compaction**.\n\nTaken together, the field seems to be converging on a context operating system: a system where agents do not merely consume context but actively create, archive, retrieve, refine, audit, and retire it.\n\nThe biggest open problem is governance. These systems can preserve more detail than summaries and can adapt without labels, but they need machinery for provenance, rollback, privacy boundaries, drift detection, and anti-contamination. A playbook that grows forever is not automatically intelligence; it can become an unreviewed pile of rules unless monitored.\n\n## Interesting Initial Take\n\nARC and ACM attack the \&quot;forgot the fact\&quot; problem. ACE attacks the \&quot;failed to learn the lesson\&quot; problem. A practical agent probably needs both: addressable raw recall plus curated reusable lessons.\n\n## Near-Term Research Watch\n\n- Repos that combine ACE-style playbooks with ARC-style addressable raw logs.\n- Evaluations that include delayed recall, adversarial stale facts, and multi-session tasks.\n- Monitoring dashboards for context quality.\n- Production case studies where context edits are reviewed like code.\n\n&quot;,&quot;html&quot;:&quot;&lt;h1&gt;Initial Synthesis&lt;/h1&gt;\n&lt;p&gt;The three seed papers line up into a useful stack:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;ACE is about &lt;strong&gt;learning durable playbook content&lt;/strong&gt;.&lt;/li&gt;\n&lt;li&gt;ACM is about &lt;strong&gt;agent-controlled transcript lifecycle&lt;/strong&gt;.&lt;/li&gt;\n&lt;li&gt;ARC is about &lt;strong&gt;exact recall after compaction&lt;/strong&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Taken together, the field seems to be converging on a context operating system: a system where agents do not merely consume context but actively create, archive, retrieve, refine, audit, and retire it.&lt;/p&gt;\n&lt;p&gt;The biggest open problem is governance. These systems can preserve more detail than summaries and can adapt without labels, but they need machinery for provenance, rollback, privacy boundaries, drift detection, and anti-contamination. A playbook that grows forever is not automatically intelligence; it can become an unreviewed pile of rules unless monitored.&lt;/p&gt;\n&lt;h2&gt;Interesting Initial Take&lt;/h2&gt;\n&lt;p&gt;ARC and ACM attack the &amp;quot;forgot the fact&amp;quot; problem. ACE attacks the &amp;quot;failed to learn the lesson&amp;quot; problem. A practical agent probably needs both: addressable raw recall plus curated reusable lessons.&lt;/p&gt;\n&lt;h2&gt;Near-Term Research Watch&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Repos that combine ACE-style playbooks with ARC-style addressable raw logs.&lt;/li&gt;\n&lt;li&gt;Evaluations that include delayed recall, adversarial stale facts, and multi-session tasks.&lt;/li&gt;\n&lt;li&gt;Monitoring dashboards for context quality.&lt;/li&gt;\n&lt;li&gt;Production case studies where context edits are reviewed like code.&lt;/li&gt;\n&lt;/ul&gt;&quot;},{&quot;slug&quot;:&quot;wiki/analyses/research-questions&quot;,&quot;title&quot;:&quot;Critical Research Questions&quot;,&quot;group&quot;:&quot;Wiki&quot;,&quot;section&quot;:&quot;wiki/analyses&quot;,&quot;markdown&quot;:&quot;\n# Critical Research Questions\n\n## Evaluation\n\n- Are the benchmarks representative of real agent work, or mostly synthetic/search/coding tasks?\n- Do gains persist across models, domains, longer horizons, and contradictory evidence?\n- Are learned playbooks generalizable or benchmark-contaminated?\n\n## Scale\n\n- What happens with thousands of memory objects across multi-day, multi-project tasks?\n- Does the cost of reflection, curation, storage, and recall still beat simpler summaries?\n- How does context governance work across multiple users or teams?\n\n## Monitoring\n\n- Which metrics catch context drift, stale recall, missing citations, and harmful compression?\n- Can alerts distinguish genuinely novel research from SEO commentary?\n- How should bad context rules be retired?\n\n## Safety\n\n- Can poisoned tool observations become durable instructions?\n- How are private or task-local facts prevented from becoming global playbook rules?\n- Are context edits append-only, diffable, reversible, and source-attributable?\n\n&quot;,&quot;html&quot;:&quot;&lt;h1&gt;Critical Research Questions&lt;/h1&gt;\n&lt;h2&gt;Evaluation&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Are the benchmarks representative of real agent work, or mostly synthetic/search/coding tasks?&lt;/li&gt;\n&lt;li&gt;Do gains persist across models, domains, longer horizons, and contradictory evidence?&lt;/li&gt;\n&lt;li&gt;Are learned playbooks generalizable or benchmark-contaminated?&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2&gt;Scale&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;What happens with thousands of memory objects across multi-day, multi-project tasks?&lt;/li&gt;\n&lt;li&gt;Does the cost of reflection, curation, storage, and recall still beat simpler summaries?&lt;/li&gt;\n&lt;li&gt;How does context governance work across multiple users or teams?&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2&gt;Monitoring&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Which metrics catch context drift, stale recall, missing citations, and harmful compression?&lt;/li&gt;\n&lt;li&gt;Can alerts distinguish genuinely novel research from SEO commentary?&lt;/li&gt;\n&lt;li&gt;How should bad context rules be retired?&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2&gt;Safety&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Can poisoned tool observations become durable instructions?&lt;/li&gt;\n&lt;li&gt;How are private or task-local facts prevented from becoming global playbook rules?&lt;/li&gt;\n&lt;li&gt;Are context edits append-only, diffable, reversible, and source-attributable?&lt;/li&gt;\n&lt;/ul&gt;&quot;},{&quot;slug&quot;:&quot;wiki/comparisons/bright-vs-ace-context-management&quot;,&quot;title&quot;:&quot;BRIGHT vs ACE/ACM/ARC&quot;,&quot;group&quot;:&quot;Wiki&quot;,&quot;section&quot;:&quot;wiki/comparisons&quot;,&quot;markdown&quot;:&quot;\n# BRIGHT vs ACE/ACM/ARC\n\nBRIGHT is a benchmark; ACE, ACM, and ARC are methods/frameworks. They are not directly comparable leaderboard-to-leaderboard.\n\n## What Each Measures Or Optimizes\n\n| Item | Focus | Core Question |\n|---|---|---|\n| BRIGHT | Reasoning-intensive retrieval | Can the system retrieve the right evidence when relevance is implicit? |\n| ACE | Context learning | Can the system improve future behavior by curating durable lessons into context? |\n| ACM | Agent-controlled context lifecycle | Can the agent decide when to offload and query context during long runs? |\n| ARC | Addressable recall after compaction | Can exact prior observations remain recoverable under a bounded active context? |\n\n## Conceptual Relationship\n\nBRIGHT exposes retrieval failure under hidden relevance. ACE could learn reusable query-reasoning strategies over BRIGHT tasks. ACM could help a search agent maintain long trajectories without rigid summarization. ARC could preserve exact search observations and citations so the agent can revisit evidence without rerunning tools.\n\n## Evaluation Design Idea\n\nA stronger ACE evaluation could use BRIGHT episodes where an agent:\n\n1. Attempts retrieval tasks.\n2. Records successful and failed query strategies.\n3. Curates playbook deltas via ACE.\n4. Uses ACM/ARC-like mechanisms to retain search traces.\n5. Tests whether the playbook improves held-out BRIGHT tasks without benchmark leakage.\n\nMetrics should include nDCG@10, recall, cost/latency, number of queries, playbook growth, stale-rule rate, and ablation against raw retrieval-only systems.\n\n## Caveat\n\nNone of the seed ACE, ACM, or ARC papers ingested so far report BRIGHT results. Any comparison is currently conceptual.\n\n&quot;,&quot;html&quot;:&quot;&lt;h1&gt;BRIGHT vs ACE/ACM/ARC&lt;/h1&gt;\n&lt;p&gt;BRIGHT is a benchmark; ACE, ACM, and ARC are methods/frameworks. They are not directly comparable leaderboard-to-leaderboard.&lt;/p&gt;\n&lt;h2&gt;What Each Measures Or Optimizes&lt;/h2&gt;\n&lt;p&gt;| Item | Focus | Core Question |&lt;/p&gt;\n&lt;p&gt;|---|---|---|&lt;/p&gt;\n&lt;p&gt;| BRIGHT | Reasoning-intensive retrieval | Can the system retrieve the right evidence when relevance is implicit? |&lt;/p&gt;\n&lt;p&gt;| ACE | Context learning | Can the system improve future behavior by curating durable lessons into context? |&lt;/p&gt;\n&lt;p&gt;| ACM | Agent-controlled context lifecycle | Can the agent decide when to offload and query context during long runs? |&lt;/p&gt;\n&lt;p&gt;| ARC | Addressable recall after compaction | Can exact prior observations remain recoverable under a bounded active context? |&lt;/p&gt;\n&lt;h2&gt;Conceptual Relationship&lt;/h2&gt;\n&lt;p&gt;BRIGHT exposes retrieval failure under hidden relevance. ACE could learn reusable query-reasoning strategies over BRIGHT tasks. ACM could help a search agent maintain long trajectories without rigid summarization. ARC could preserve exact search observations and citations so the agent can revisit evidence without rerunning tools.&lt;/p&gt;\n&lt;h2&gt;Evaluation Design Idea&lt;/h2&gt;\n&lt;p&gt;A stronger ACE evaluation could use BRIGHT episodes where an agent:&lt;/p&gt;\n&lt;p&gt;1. Attempts retrieval tasks.&lt;/p&gt;\n&lt;p&gt;2. Records successful and failed query strategies.&lt;/p&gt;\n&lt;p&gt;3. Curates playbook deltas via ACE.&lt;/p&gt;\n&lt;p&gt;4. Uses ACM/ARC-like mechanisms to retain search traces.&lt;/p&gt;\n&lt;p&gt;5. Tests whether the playbook improves held-out BRIGHT tasks without benchmark leakage.&lt;/p&gt;\n&lt;p&gt;Metrics should include nDCG@10, recall, cost/latency, number of queries, playbook growth, stale-rule rate, and ablation against raw retrieval-only systems.&lt;/p&gt;\n&lt;h2&gt;Caveat&lt;/h2&gt;\n&lt;p&gt;None of the seed ACE, ACM, or ARC papers ingested so far report BRIGHT results. Any comparison is currently conceptual.&lt;/p&gt;&quot;},{&quot;slug&quot;:&quot;wiki/concepts/addressable-recall-compaction&quot;,&quot;title&quot;:&quot;Addressable Recall Compaction&quot;,&quot;group&quot;:&quot;Wiki&quot;,&quot;section&quot;:&quot;wiki/concepts&quot;,&quot;markdown&quot;:&quot;\n# Addressable Recall Compaction\n\nARC makes archived observations explicitly addressable. Rather than hoping a summary or vector retriever preserves a detail, the system leaves a dereferenceable citation in the active transcript.\n\nThis is especially relevant for tool-heavy agents, where exact prior observations, command outputs, and error messages may matter later.\n\n## Sources\n\n- [[../sources/2607.25066-addressable-recall-compaction]]\n\n&quot;,&quot;html&quot;:&quot;&lt;h1&gt;Addressable Recall Compaction&lt;/h1&gt;\n&lt;p&gt;ARC makes archived observations explicitly addressable. Rather than hoping a summary or vector retriever preserves a detail, the system leaves a dereferenceable citation in the active transcript.&lt;/p&gt;\n&lt;p&gt;This is especially relevant for tool-heavy agents, where exact prior observations, command outputs, and error messages may matter later.&lt;/p&gt;\n&lt;h2&gt;Sources&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\&quot;#../sources/2607.25066-addressable-recall-compaction\&quot;&gt;2607.25066 addressable recall compaction&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;&quot;},{&quot;slug&quot;:&quot;wiki/concepts/agentic-context-engineering&quot;,&quot;title&quot;:&quot;Agentic Context Engineering&quot;,&quot;group&quot;:&quot;Wiki&quot;,&quot;section&quot;:&quot;wiki/concepts&quot;,&quot;markdown&quot;:&quot;\n# Agentic Context Engineering\n\nACE is a framework for adapting LLM applications by evolving context instead of updating weights. The key object is a structured playbook: reusable strategies, concepts, and failure modes that accumulate over time.\n\n## Mechanism\n\n- Generate task traces.\n- Reflect on success/failure signals.\n- Curate small delta updates.\n- Merge updates into a structured playbook.\n- Periodically refine for redundancy and relevance.\n\n## Why It Matters\n\nACE turns context from a transient prompt into an auditable artifact. That creates leverage for self-improving systems, but it also creates a new operations problem: durable context can become stale, contaminated, overfit, or harmful.\n\n## Sources\n\n- [[../sources/2510.04618-agentic-context-engineering]]\n- [[../sources/sambanova-ace-open-sourced]]\n\n&quot;,&quot;html&quot;:&quot;&lt;h1&gt;Agentic Context Engineering&lt;/h1&gt;\n&lt;p&gt;ACE is a framework for adapting LLM applications by evolving context instead of updating weights. The key object is a structured playbook: reusable strategies, concepts, and failure modes that accumulate over time.&lt;/p&gt;\n&lt;h2&gt;Mechanism&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Generate task traces.&lt;/li&gt;\n&lt;li&gt;Reflect on success/failure signals.&lt;/li&gt;\n&lt;li&gt;Curate small delta updates.&lt;/li&gt;\n&lt;li&gt;Merge updates into a structured playbook.&lt;/li&gt;\n&lt;li&gt;Periodically refine for redundancy and relevance.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2&gt;Why It Matters&lt;/h2&gt;\n&lt;p&gt;ACE turns context from a transient prompt into an auditable artifact. That creates leverage for self-improving systems, but it also creates a new operations problem: durable context can become stale, contaminated, overfit, or harmful.&lt;/p&gt;\n&lt;h2&gt;Sources&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\&quot;#../sources/2510.04618-agentic-context-engineering\&quot;&gt;2510.04618 agentic context engineering&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\&quot;#../sources/sambanova-ace-open-sourced\&quot;&gt;sambanova ace open sourced&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;&quot;},{&quot;slug&quot;:&quot;wiki/concepts/agentic-context-management&quot;,&quot;title&quot;:&quot;Agentic Context Management&quot;,&quot;group&quot;:&quot;Wiki&quot;,&quot;section&quot;:&quot;wiki/concepts&quot;,&quot;markdown&quot;:&quot;\n# Agentic Context Management\n\nACM focuses on active transcript control during long-horizon tasks. Instead of fixed-threshold summarization, the agent decides when to compress, stores raw context externally, and queries it later.\n\nThe important distinction is lifecycle control: context management is an action inside the agent loop rather than an external cleanup policy.\n\n## Sources\n\n- [[../sources/2607.23809-agentic-context-management]]\n\n&quot;,&quot;html&quot;:&quot;&lt;h1&gt;Agentic Context Management&lt;/h1&gt;\n&lt;p&gt;ACM focuses on active transcript control during long-horizon tasks. Instead of fixed-threshold summarization, the agent decides when to compress, stores raw context externally, and queries it later.&lt;/p&gt;\n&lt;p&gt;The important distinction is lifecycle control: context management is an action inside the agent loop rather than an external cleanup policy.&lt;/p&gt;\n&lt;h2&gt;Sources&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\&quot;#../sources/2607.23809-agentic-context-management\&quot;&gt;2607.23809 agentic context management&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;&quot;},{&quot;slug&quot;:&quot;wiki/concepts/context-collapse&quot;,&quot;title&quot;:&quot;Context Collapse&quot;,&quot;group&quot;:&quot;Wiki&quot;,&quot;section&quot;:&quot;wiki/concepts&quot;,&quot;markdown&quot;:&quot;\n# Context Collapse\n\nContext collapse is the failure mode where iterative rewriting turns a rich context into a much shorter, less informative summary, losing domain-specific details and degrading downstream performance.\n\nIn the ACE paper&#39;s AppWorld case study, a context reportedly collapsed from 18,282 tokens to 122 tokens at the next step, with accuracy dropping below the no-adaptation baseline. This should be cited narrowly as a case study, not a universal law.\n\n## Related\n\n- [[agentic-context-engineering]]\n\n&quot;,&quot;html&quot;:&quot;&lt;h1&gt;Context Collapse&lt;/h1&gt;\n&lt;p&gt;Context collapse is the failure mode where iterative rewriting turns a rich context into a much shorter, less informative summary, losing domain-specific details and degrading downstream performance.&lt;/p&gt;\n&lt;p&gt;In the ACE paper&amp;#39;s AppWorld case study, a context reportedly collapsed from 18,282 tokens to 122 tokens at the next step, with accuracy dropping below the no-adaptation baseline. This should be cited narrowly as a case study, not a universal law.&lt;/p&gt;\n&lt;h2&gt;Related&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\&quot;#agentic-context-engineering\&quot;&gt;agentic context engineering&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;&quot;},{&quot;slug&quot;:&quot;wiki/concepts/evaluation-monitoring-scale&quot;,&quot;title&quot;:&quot;Evaluation, Monitoring, and Scale&quot;,&quot;group&quot;:&quot;Wiki&quot;,&quot;section&quot;:&quot;wiki/concepts&quot;,&quot;markdown&quot;:&quot;\n# Evaluation, Monitoring, and Scale\n\nACE-style systems need metrics beyond task success:\n\n- Context growth rate and token budget pressure.\n- Promotion rate for new playbook items.\n- Reversal/deletion rate for bad or stale context.\n- Citation coverage for durable claims.\n- Retrieval/recall success rate when archived context is needed.\n- Stale-rule count and contradiction count.\n- Cost and latency per useful context update.\n- Harmful-context incidents and poisoning attempts.\n\n## Questions\n\n- Does the playbook improve general capability or memorize benchmark quirks?\n- Can the agent find the right archived information when it does not know the right ID or query?\n- What are the rollback mechanics for bad context updates?\n- How does the system separate private observations from durable instructions?\n\n&quot;,&quot;html&quot;:&quot;&lt;h1&gt;Evaluation, Monitoring, and Scale&lt;/h1&gt;\n&lt;p&gt;ACE-style systems need metrics beyond task success:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Context growth rate and token budget pressure.&lt;/li&gt;\n&lt;li&gt;Promotion rate for new playbook items.&lt;/li&gt;\n&lt;li&gt;Reversal/deletion rate for bad or stale context.&lt;/li&gt;\n&lt;li&gt;Citation coverage for durable claims.&lt;/li&gt;\n&lt;li&gt;Retrieval/recall success rate when archived context is needed.&lt;/li&gt;\n&lt;li&gt;Stale-rule count and contradiction count.&lt;/li&gt;\n&lt;li&gt;Cost and latency per useful context update.&lt;/li&gt;\n&lt;li&gt;Harmful-context incidents and poisoning attempts.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2&gt;Questions&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Does the playbook improve general capability or memorize benchmark quirks?&lt;/li&gt;\n&lt;li&gt;Can the agent find the right archived information when it does not know the right ID or query?&lt;/li&gt;\n&lt;li&gt;What are the rollback mechanics for bad context updates?&lt;/li&gt;\n&lt;li&gt;How does the system separate private observations from durable instructions?&lt;/li&gt;\n&lt;/ul&gt;&quot;},{&quot;slug&quot;:&quot;wiki/concepts/reasoning-intensive-retrieval&quot;,&quot;title&quot;:&quot;Reasoning-Intensive Retrieval&quot;,&quot;group&quot;:&quot;Wiki&quot;,&quot;section&quot;:&quot;wiki/concepts&quot;,&quot;markdown&quot;:&quot;\n# Reasoning-Intensive Retrieval\n\nReasoning-intensive retrieval is retrieval where the relevant document is not obvious from lexical overlap or ordinary embedding similarity. The retriever must infer the query&#39;s intent, identify hidden constraints, map the problem to an underlying concept, and retrieve evidence connected by that concept.\n\nBRIGHT categorizes this as retrieval requiring reasoning traces such as:\n\n- Deductive reasoning.\n- Analogical reasoning.\n- Causal reasoning.\n- Analytical reasoning.\n\n## Why It Matters For ACE\n\nReasoning-intensive retrieval is a natural testbed for ACE-style context systems because agents can accumulate reusable retrieval playbooks:\n\n- How to rewrite noisy user questions into retrieval intent.\n- How to avoid semantic traps where negatives look similar but are logically wrong.\n- How to decompose multi-part queries.\n- How to decide when to use dense retrieval, sparse retrieval, reranking, or agentic search.\n\nThe key governance issue is whether learned retrieval playbooks generalize or simply memorize benchmark-specific tricks.\n\n## Sources\n\n- [[../sources/2407.12883-bright]]\n- [[../sources/bright-leaderboard-top-methods]]\n\n&quot;,&quot;html&quot;:&quot;&lt;h1&gt;Reasoning-Intensive Retrieval&lt;/h1&gt;\n&lt;p&gt;Reasoning-intensive retrieval is retrieval where the relevant document is not obvious from lexical overlap or ordinary embedding similarity. The retriever must infer the query&amp;#39;s intent, identify hidden constraints, map the problem to an underlying concept, and retrieve evidence connected by that concept.&lt;/p&gt;\n&lt;p&gt;BRIGHT categorizes this as retrieval requiring reasoning traces such as:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Deductive reasoning.&lt;/li&gt;\n&lt;li&gt;Analogical reasoning.&lt;/li&gt;\n&lt;li&gt;Causal reasoning.&lt;/li&gt;\n&lt;li&gt;Analytical reasoning.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2&gt;Why It Matters For ACE&lt;/h2&gt;\n&lt;p&gt;Reasoning-intensive retrieval is a natural testbed for ACE-style context systems because agents can accumulate reusable retrieval playbooks:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;How to rewrite noisy user questions into retrieval intent.&lt;/li&gt;\n&lt;li&gt;How to avoid semantic traps where negatives look similar but are logically wrong.&lt;/li&gt;\n&lt;li&gt;How to decompose multi-part queries.&lt;/li&gt;\n&lt;li&gt;How to decide when to use dense retrieval, sparse retrieval, reranking, or agentic search.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The key governance issue is whether learned retrieval playbooks generalize or simply memorize benchmark-specific tricks.&lt;/p&gt;\n&lt;h2&gt;Sources&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\&quot;#../sources/2407.12883-bright\&quot;&gt;2407.12883 bright&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\&quot;#../sources/bright-leaderboard-top-methods\&quot;&gt;bright leaderboard top methods&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;&quot;},{&quot;slug&quot;:&quot;wiki/index&quot;,&quot;title&quot;:&quot;ACE Context Research Wiki&quot;,&quot;group&quot;:&quot;Wiki&quot;,&quot;section&quot;:&quot;wiki/index&quot;,&quot;markdown&quot;:&quot;\n# ACE Context Research Wiki\n\nPersistent research wiki for Agentic Context Engineering (ACE) and adjacent context-management techniques.\n\n## Start Here\n\n- [[overview]] - Current synthesis of the research area.\n- [[analyses/research-questions]] - Evaluation, scale, monitoring, and governance questions to keep asking.\n- [[analyses/initial-synthesis-2026-08-16]] - First deep pass over the seed papers.\n\n## Sources\n\n- [[sources/2407.12883-bright]] - Reasoning-intensive retrieval benchmark.\n- [[sources/bright-leaderboard-top-methods]] - Top BRIGHT leaderboard methods snapshot.\n- [[sources/2510.04618-agentic-context-engineering]] - ACE paper, ICLR 2026.\n- [[sources/2607.23809-agentic-context-management]] - ACM paper, fresh arXiv preprint.\n- [[sources/2607.25066-addressable-recall-compaction]] - ARC paper, fresh arXiv preprint.\n- [[sources/karpathy-llm-wiki-gist]] - Andrej Karpathy&#39;s LLM Wiki pattern.\n- [[sources/langchain-context-engineering-docs]] - LangChain context-engineering documentation.\n- [[sources/sambanova-ace-open-sourced]] - SambaNova ACE implementation announcement.\n\n## Concepts\n\n- [[concepts/agentic-context-engineering]]\n- [[concepts/agentic-context-management]]\n- [[concepts/addressable-recall-compaction]]\n- [[concepts/context-collapse]]\n- [[concepts/evaluation-monitoring-scale]]\n- [[concepts/reasoning-intensive-retrieval]]\n\n## Comparisons\n\n- [[comparisons/bright-vs-ace-context-management]]\n\n## Analyses\n\n- [[analyses/bright-leaderboard-deep-dive-2026-08-16]]\n\n## Reports\n\n- [Latest interesting items](../reports/latest-interesting.md)\n&quot;,&quot;html&quot;:&quot;&lt;h1&gt;ACE Context Research Wiki&lt;/h1&gt;\n&lt;p&gt;Persistent research wiki for Agentic Context Engineering (ACE) and adjacent context-management techniques.&lt;/p&gt;\n&lt;h2&gt;Start Here&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\&quot;#overview\&quot;&gt;overview&lt;/a&gt; - Current synthesis of the research area.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\&quot;#analyses/research-questions\&quot;&gt;research questions&lt;/a&gt; - Evaluation, scale, monitoring, and governance questions to keep asking.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\&quot;#analyses/initial-synthesis-2026-08-16\&quot;&gt;initial synthesis 2026 08 16&lt;/a&gt; - First deep pass over the seed papers.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2&gt;Sources&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\&quot;#sources/2407.12883-bright\&quot;&gt;2407.12883 bright&lt;/a&gt; - Reasoning-intensive retrieval benchmark.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\&quot;#sources/bright-leaderboard-top-methods\&quot;&gt;bright leaderboard top methods&lt;/a&gt; - Top BRIGHT leaderboard methods snapshot.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\&quot;#sources/2510.04618-agentic-context-engineering\&quot;&gt;2510.04618 agentic context engineering&lt;/a&gt; - ACE paper, ICLR 2026.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\&quot;#sources/2607.23809-agentic-context-management\&quot;&gt;2607.23809 agentic context management&lt;/a&gt; - ACM paper, fresh arXiv preprint.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\&quot;#sources/2607.25066-addressable-recall-compaction\&quot;&gt;2607.25066 addressable recall compaction&lt;/a&gt; - ARC paper, fresh arXiv preprint.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\&quot;#sources/karpathy-llm-wiki-gist\&quot;&gt;karpathy llm wiki gist&lt;/a&gt; - Andrej Karpathy&amp;#39;s LLM Wiki pattern.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\&quot;#sources/langchain-context-engineering-docs\&quot;&gt;langchain context engineering docs&lt;/a&gt; - LangChain context-engineering documentation.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\&quot;#sources/sambanova-ace-open-sourced\&quot;&gt;sambanova ace open sourced&lt;/a&gt; - SambaNova ACE implementation announcement.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2&gt;Concepts&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\&quot;#concepts/agentic-context-engineering\&quot;&gt;agentic context engineering&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\&quot;#concepts/agentic-context-management\&quot;&gt;agentic context management&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\&quot;#concepts/addressable-recall-compaction\&quot;&gt;addressable recall compaction&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\&quot;#concepts/context-collapse\&quot;&gt;context collapse&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\&quot;#concepts/evaluation-monitoring-scale\&quot;&gt;evaluation monitoring scale&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\&quot;#concepts/reasoning-intensive-retrieval\&quot;&gt;reasoning intensive retrieval&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2&gt;Comparisons&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\&quot;#comparisons/bright-vs-ace-context-management\&quot;&gt;bright vs ace context management&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2&gt;Analyses&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\&quot;#analyses/bright-leaderboard-deep-dive-2026-08-16\&quot;&gt;bright leaderboard deep dive 2026 08 16&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2&gt;Reports&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\&quot;#reports/latest-interesting\&quot;&gt;Latest interesting items&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;&quot;},{&quot;slug&quot;:&quot;wiki/log&quot;,&quot;title&quot;:&quot;Log&quot;,&quot;group&quot;:&quot;Wiki&quot;,&quot;section&quot;:&quot;wiki/log&quot;,&quot;markdown&quot;:&quot;# Log\n\n## [2026-08-16] setup | ACE context research wiki\n\nCreated the LLM Wiki structure under `~/projects/ace-context-research`, downloaded seed PDFs, extracted local text, and added initial source/concept/analysis pages.\n\nSeed sources:\n\n- arXiv:2510.04618, Agentic Context Engineering.\n- arXiv:2607.23809, Agentic Context Management.\n- arXiv:2607.25066, Addressable Recall Compaction.\n- Karpathy LLM Wiki gist.\n- LangChain context engineering docs.\n- SambaNova ACE open-source announcement.\n\nReview notes: a subagent critique flagged that ACE is the strongest provenance source, ACM and ARC are very fresh, ARC appears preprint-only from checked metadata, and benchmark claims must be worded narrowly.\n\n## [2026-08-16] ingest | BRIGHT benchmark and leaderboard methods\n\nIngested BRIGHT as a reasoning-intensive retrieval benchmark and added a deep dive on top leaderboard methods: Mira-Reasoning-Retrieval, INF-X-Retriever, RakanEmbed4B, NVIDIA NeMo Retriever Agentic Retrieval, DIVER-v3-GroupRank, and BGE-Reasoner-0928.\n\nPages touched:\n\n- [[sources/2407.12883-bright]]\n- [[sources/bright-leaderboard-top-methods]]\n- [[concepts/reasoning-intensive-retrieval]]\n- [[comparisons/bright-vs-ace-context-management]]\n- [[analyses/bright-leaderboard-deep-dive-2026-08-16]]\n\nKey synthesis: BRIGHT is not directly comparable to ACE/ACM/ARC, but it is a strong candidate evaluation surface for an ACE+ACM+ARC retrieval agent. Top methods mostly win through intent transformation, reasoning-tuned embeddings, reranking/fusion, or agentic query loops.\n\nUnresolved questions: no ACE/ACM/ARC paper reports BRIGHT results; some leaderboard metadata around long-document metrics/dates is inconsistent; several top method descriptions are self-reported project pages rather than papers.\n&quot;,&quot;html&quot;:&quot;&lt;h1&gt;Log&lt;/h1&gt;\n&lt;h2&gt;[2026-08-16] setup | ACE context research wiki&lt;/h2&gt;\n&lt;p&gt;Created the LLM Wiki structure under &lt;code&gt;~/projects/ace-context-research&lt;/code&gt;, downloaded seed PDFs, extracted local text, and added initial source/concept/analysis pages.&lt;/p&gt;\n&lt;p&gt;Seed sources:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;arXiv:2510.04618, Agentic Context Engineering.&lt;/li&gt;\n&lt;li&gt;arXiv:2607.23809, Agentic Context Management.&lt;/li&gt;\n&lt;li&gt;arXiv:2607.25066, Addressable Recall Compaction.&lt;/li&gt;\n&lt;li&gt;Karpathy LLM Wiki gist.&lt;/li&gt;\n&lt;li&gt;LangChain context engineering docs.&lt;/li&gt;\n&lt;li&gt;SambaNova ACE open-source announcement.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Review notes: a subagent critique flagged that ACE is the strongest provenance source, ACM and ARC are very fresh, ARC appears preprint-only from checked metadata, and benchmark claims must be worded narrowly.&lt;/p&gt;\n&lt;h2&gt;[2026-08-16] ingest | BRIGHT benchmark and leaderboard methods&lt;/h2&gt;\n&lt;p&gt;Ingested BRIGHT as a reasoning-intensive retrieval benchmark and added a deep dive on top leaderboard methods: Mira-Reasoning-Retrieval, INF-X-Retriever, RakanEmbed4B, NVIDIA NeMo Retriever Agentic Retrieval, DIVER-v3-GroupRank, and BGE-Reasoner-0928.&lt;/p&gt;\n&lt;p&gt;Pages touched:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\&quot;#sources/2407.12883-bright\&quot;&gt;2407.12883 bright&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\&quot;#sources/bright-leaderboard-top-methods\&quot;&gt;bright leaderboard top methods&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\&quot;#concepts/reasoning-intensive-retrieval\&quot;&gt;reasoning intensive retrieval&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\&quot;#comparisons/bright-vs-ace-context-management\&quot;&gt;bright vs ace context management&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\&quot;#analyses/bright-leaderboard-deep-dive-2026-08-16\&quot;&gt;bright leaderboard deep dive 2026 08 16&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Key synthesis: BRIGHT is not directly comparable to ACE/ACM/ARC, but it is a strong candidate evaluation surface for an ACE+ACM+ARC retrieval agent. Top methods mostly win through intent transformation, reasoning-tuned embeddings, reranking/fusion, or agentic query loops.&lt;/p&gt;\n&lt;p&gt;Unresolved questions: no ACE/ACM/ARC paper reports BRIGHT results; some leaderboard metadata around long-document metrics/dates is inconsistent; several top method descriptions are self-reported project pages rather than papers.&lt;/p&gt;&quot;},{&quot;slug&quot;:&quot;wiki/overview&quot;,&quot;title&quot;:&quot;ACE Context Research Overview&quot;,&quot;group&quot;:&quot;Wiki&quot;,&quot;section&quot;:&quot;wiki/overview&quot;,&quot;markdown&quot;:&quot;\n# Overview\n\nACE, in this wiki, means **Agentic Context Engineering**: treating an LLM application&#39;s context as an evolving playbook rather than a static prompt or repeatedly summarized transcript.\n\nThe core research direction is shifting from \&quot;how do we fit more text into the prompt?\&quot; to \&quot;what lifecycle should context follow?\&quot; The seed papers split the space into three complementary moves:\n\n- **ACE** grows and refines durable context items through Generator, Reflector, and Curator roles, aiming to avoid brevity bias and context collapse. See [[sources/2510.04618-agentic-context-engineering]].\n- **ACM** gives an agent explicit tools to decide when to offload context and later query the raw offloaded memory, reducing peak token pressure in long-horizon search and coding tasks. See [[sources/2607.23809-agentic-context-management]].\n- **ARC** stores tool observations in an append-only, addressable log and leaves citations in the active view, making recall explicit rather than dependent only on summaries or similarity search. See [[sources/2607.25066-addressable-recall-compaction]].\n\n## Current Thesis\n\nThe interesting axis is not just compression quality. It is **context governance**: how context is created, promoted, compacted, retrieved, audited, retired, and protected from poisoning. ACE-style playbooks are promising because they are diffable and interpretable, but they create a new production problem: bad lessons can become durable behavior.\n\n## Watch Closely\n\n- Whether gains survive outside AppWorld, finance QA, search, coding, Needle-in-Haystack, and LongBench-v2.\n- Whether \&quot;lossless\&quot; storage translates into reliable agent use when the agent does not know what to recall.\n- Whether curation/reflection costs stay favorable when tool calls, storage, and review overhead are included.\n- How systems monitor stale rules, contaminated playbooks, privacy leaks, and benchmark-specific shortcuts.\n\n## BRIGHT Connection\n\nBRIGHT is now tracked as a likely evaluation target for ACE-style context systems. It does not evaluate ACE directly; it evaluates reasoning-intensive retrieval. The useful link is that BRIGHT&#39;s top methods increasingly rely on query intent distillation, reasoning-specialized embedding, reranking, fusion, or agentic search. Those are exactly the kinds of strategies an ACE playbook could learn, while ACM/ARC could preserve long retrieval trajectories and exact search evidence.\n&quot;,&quot;html&quot;:&quot;&lt;h1&gt;Overview&lt;/h1&gt;\n&lt;p&gt;ACE, in this wiki, means &lt;strong&gt;Agentic Context Engineering&lt;/strong&gt;: treating an LLM application&amp;#39;s context as an evolving playbook rather than a static prompt or repeatedly summarized transcript.&lt;/p&gt;\n&lt;p&gt;The core research direction is shifting from &amp;quot;how do we fit more text into the prompt?&amp;quot; to &amp;quot;what lifecycle should context follow?&amp;quot; The seed papers split the space into three complementary moves:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;ACE&lt;/strong&gt; grows and refines durable context items through Generator, Reflector, and Curator roles, aiming to avoid brevity bias and context collapse. See &lt;a href=\&quot;#sources/2510.04618-agentic-context-engineering\&quot;&gt;2510.04618 agentic context engineering&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;ACM&lt;/strong&gt; gives an agent explicit tools to decide when to offload context and later query the raw offloaded memory, reducing peak token pressure in long-horizon search and coding tasks. See &lt;a href=\&quot;#sources/2607.23809-agentic-context-management\&quot;&gt;2607.23809 agentic context management&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;ARC&lt;/strong&gt; stores tool observations in an append-only, addressable log and leaves citations in the active view, making recall explicit rather than dependent only on summaries or similarity search. See &lt;a href=\&quot;#sources/2607.25066-addressable-recall-compaction\&quot;&gt;2607.25066 addressable recall compaction&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2&gt;Current Thesis&lt;/h2&gt;\n&lt;p&gt;The interesting axis is not just compression quality. It is &lt;strong&gt;context governance&lt;/strong&gt;: how context is created, promoted, compacted, retrieved, audited, retired, and protected from poisoning. ACE-style playbooks are promising because they are diffable and interpretable, but they create a new production problem: bad lessons can become durable behavior.&lt;/p&gt;\n&lt;h2&gt;Watch Closely&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Whether gains survive outside AppWorld, finance QA, search, coding, Needle-in-Haystack, and LongBench-v2.&lt;/li&gt;\n&lt;li&gt;Whether &amp;quot;lossless&amp;quot; storage translates into reliable agent use when the agent does not know what to recall.&lt;/li&gt;\n&lt;li&gt;Whether curation/reflection costs stay favorable when tool calls, storage, and review overhead are included.&lt;/li&gt;\n&lt;li&gt;How systems monitor stale rules, contaminated playbooks, privacy leaks, and benchmark-specific shortcuts.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2&gt;BRIGHT Connection&lt;/h2&gt;\n&lt;p&gt;BRIGHT is now tracked as a likely evaluation target for ACE-style context systems. It does not evaluate ACE directly; it evaluates reasoning-intensive retrieval. The useful link is that BRIGHT&amp;#39;s top methods increasingly rely on query intent distillation, reasoning-specialized embedding, reranking, fusion, or agentic search. Those are exactly the kinds of strategies an ACE playbook could learn, while ACM/ARC could preserve long retrieval trajectories and exact search evidence.&lt;/p&gt;&quot;},{&quot;slug&quot;:&quot;wiki/sources/2407.12883-bright&quot;,&quot;title&quot;:&quot;BRIGHT: A Realistic and Challenging Benchmark for Reasoning-Intensive Retrieval&quot;,&quot;group&quot;:&quot;Wiki&quot;,&quot;section&quot;:&quot;wiki/sources&quot;,&quot;markdown&quot;:&quot;\n# BRIGHT\n\n## Citation\n\nHongjin Su et al. \&quot;BRIGHT: A Realistic and Challenging Benchmark for Reasoning-Intensive Retrieval.\&quot; arXiv:2407.12883; ICLR 2025 version on OpenReview/proceedings; v4 submitted 2025-03-26.\n\n## Core Claim\n\nBRIGHT is a retrieval benchmark where relevance requires reasoning beyond keyword or ordinary semantic matching. The paper frames this as \&quot;level 3\&quot; retrieval: the query and relevant document may be connected through an underlying principle, algorithm, theorem, causal mechanism, or analytical chain that is not explicit in surface text.\n\n## Dataset\n\nThe arXiv abstract reports 1,384 real-world queries spanning domains such as economics, psychology, mathematics, and coding. The official site describes 1,385 real-world queries from StackExchange, LeetCode, and math competitions. Treat the 1,384/1,385 mismatch as a version/source-count discrepancy.\n\nBRIGHT includes 12 short-document datasets and long-document variants. Short-document leaderboard scores are average nDCG@10 across 12 datasets.\n\n## Baseline Findings\n\nThe paper reports that SFR-Embedding-Mistral scores 59.0 on the MTEB retrieval subset but only 18.3 nDCG@10 on BRIGHT. It also reports that using explicit LLM reasoning steps as the retrieval query improves performance by up to 12.2 points.\n\n## Relevance To ACE\n\nBRIGHT does not evaluate ACE-style playbook learning directly. It is relevant because it tests whether retrieval systems can reason about what evidence is needed. ACE could plausibly be evaluated on BRIGHT by learning reusable query-reasoning strategies, while ACM/ARC could preserve search traces and exact evidence during long retrieval runs.\n\n## Wiki Links\n\n- [[../concepts/reasoning-intensive-retrieval]]\n- [[../comparisons/bright-vs-ace-context-management]]\n- [[../analyses/bright-leaderboard-deep-dive-2026-08-16]]\n\n&quot;,&quot;html&quot;:&quot;&lt;h1&gt;BRIGHT&lt;/h1&gt;\n&lt;h2&gt;Citation&lt;/h2&gt;\n&lt;p&gt;Hongjin Su et al. &amp;quot;BRIGHT: A Realistic and Challenging Benchmark for Reasoning-Intensive Retrieval.&amp;quot; arXiv:2407.12883; ICLR 2025 version on OpenReview/proceedings; v4 submitted 2025-03-26.&lt;/p&gt;\n&lt;h2&gt;Core Claim&lt;/h2&gt;\n&lt;p&gt;BRIGHT is a retrieval benchmark where relevance requires reasoning beyond keyword or ordinary semantic matching. The paper frames this as &amp;quot;level 3&amp;quot; retrieval: the query and relevant document may be connected through an underlying principle, algorithm, theorem, causal mechanism, or analytical chain that is not explicit in surface text.&lt;/p&gt;\n&lt;h2&gt;Dataset&lt;/h2&gt;\n&lt;p&gt;The arXiv abstract reports 1,384 real-world queries spanning domains such as economics, psychology, mathematics, and coding. The official site describes 1,385 real-world queries from StackExchange, LeetCode, and math competitions. Treat the 1,384/1,385 mismatch as a version/source-count discrepancy.&lt;/p&gt;\n&lt;p&gt;BRIGHT includes 12 short-document datasets and long-document variants. Short-document leaderboard scores are average nDCG@10 across 12 datasets.&lt;/p&gt;\n&lt;h2&gt;Baseline Findings&lt;/h2&gt;\n&lt;p&gt;The paper reports that SFR-Embedding-Mistral scores 59.0 on the MTEB retrieval subset but only 18.3 nDCG@10 on BRIGHT. It also reports that using explicit LLM reasoning steps as the retrieval query improves performance by up to 12.2 points.&lt;/p&gt;\n&lt;h2&gt;Relevance To ACE&lt;/h2&gt;\n&lt;p&gt;BRIGHT does not evaluate ACE-style playbook learning directly. It is relevant because it tests whether retrieval systems can reason about what evidence is needed. ACE could plausibly be evaluated on BRIGHT by learning reusable query-reasoning strategies, while ACM/ARC could preserve search traces and exact evidence during long retrieval runs.&lt;/p&gt;\n&lt;h2&gt;Wiki Links&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\&quot;#../concepts/reasoning-intensive-retrieval\&quot;&gt;reasoning intensive retrieval&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\&quot;#../comparisons/bright-vs-ace-context-management\&quot;&gt;bright vs ace context management&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\&quot;#../analyses/bright-leaderboard-deep-dive-2026-08-16\&quot;&gt;bright leaderboard deep dive 2026 08 16&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;&quot;},{&quot;slug&quot;:&quot;wiki/sources/2510.04618-agentic-context-engineering&quot;,&quot;title&quot;:&quot;Agentic Context Engineering: Evolving Contexts for Self-Improving Language Models&quot;,&quot;group&quot;:&quot;Wiki&quot;,&quot;section&quot;:&quot;wiki/sources&quot;,&quot;markdown&quot;:&quot;\n# Agentic Context Engineering\n\n## Citation\n\nQizheng Zhang et al. \&quot;Agentic Context Engineering: Evolving Contexts for Self-Improving Language Models.\&quot; arXiv:2510.04618. Comment says ICLR 2026; v3 submitted 2026-03-29.\n\n## Core Claim\n\nACE treats context as an evolving playbook that accumulates, refines, and organizes strategies through Generator, Reflector, and Curator roles. The paper argues this avoids two failure modes in prior context adaptation: brevity bias and context collapse.\n\n## Method\n\n- **Generator** produces task trajectories and marks useful or misleading context bullets.\n- **Reflector** extracts concrete insights from successes, errors, execution feedback, and labels when available.\n- **Curator** writes small delta context items that are merged into the playbook using non-LLM logic.\n- Context is itemized into structured bullets with metadata rather than rewritten as one monolithic prompt.\n- The system uses grow-and-refine: contexts expand, then redundant or stale items are consolidated.\n\n## Evaluation Notes\n\nThe paper reports results on AppWorld and domain-specific finance benchmarks, with additional medical and text-to-SQL experiments in appendices. On AppWorld with DeepSeek-V3.1-671B, Table 1 reports ReAct baseline average 42.4, offline ReAct+ACE average 59.4 with labels, and online ReAct+ACE average 59.5 without labels. The paper summarizes this as an average agent improvement of +10.6% over selected baselines and +8.6% on finance.\n\n## Limitations\n\nThe authors state ACE relies on a reasonably strong Reflector. If the Reflector cannot extract meaningful insights, the context can become noisy or harmful. They also note not all tasks benefit from rich context; some benefit more from concise high-level instructions or a single reusable rule.\n\n## Wiki Links\n\n- [[../concepts/agentic-context-engineering]]\n- [[../concepts/context-collapse]]\n- [[../concepts/evaluation-monitoring-scale]]\n\n&quot;,&quot;html&quot;:&quot;&lt;h1&gt;Agentic Context Engineering&lt;/h1&gt;\n&lt;h2&gt;Citation&lt;/h2&gt;\n&lt;p&gt;Qizheng Zhang et al. &amp;quot;Agentic Context Engineering: Evolving Contexts for Self-Improving Language Models.&amp;quot; arXiv:2510.04618. Comment says ICLR 2026; v3 submitted 2026-03-29.&lt;/p&gt;\n&lt;h2&gt;Core Claim&lt;/h2&gt;\n&lt;p&gt;ACE treats context as an evolving playbook that accumulates, refines, and organizes strategies through Generator, Reflector, and Curator roles. The paper argues this avoids two failure modes in prior context adaptation: brevity bias and context collapse.&lt;/p&gt;\n&lt;h2&gt;Method&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Generator&lt;/strong&gt; produces task trajectories and marks useful or misleading context bullets.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Reflector&lt;/strong&gt; extracts concrete insights from successes, errors, execution feedback, and labels when available.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Curator&lt;/strong&gt; writes small delta context items that are merged into the playbook using non-LLM logic.&lt;/li&gt;\n&lt;li&gt;Context is itemized into structured bullets with metadata rather than rewritten as one monolithic prompt.&lt;/li&gt;\n&lt;li&gt;The system uses grow-and-refine: contexts expand, then redundant or stale items are consolidated.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2&gt;Evaluation Notes&lt;/h2&gt;\n&lt;p&gt;The paper reports results on AppWorld and domain-specific finance benchmarks, with additional medical and text-to-SQL experiments in appendices. On AppWorld with DeepSeek-V3.1-671B, Table 1 reports ReAct baseline average 42.4, offline ReAct+ACE average 59.4 with labels, and online ReAct+ACE average 59.5 without labels. The paper summarizes this as an average agent improvement of +10.6% over selected baselines and +8.6% on finance.&lt;/p&gt;\n&lt;h2&gt;Limitations&lt;/h2&gt;\n&lt;p&gt;The authors state ACE relies on a reasonably strong Reflector. If the Reflector cannot extract meaningful insights, the context can become noisy or harmful. They also note not all tasks benefit from rich context; some benefit more from concise high-level instructions or a single reusable rule.&lt;/p&gt;\n&lt;h2&gt;Wiki Links&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\&quot;#../concepts/agentic-context-engineering\&quot;&gt;agentic context engineering&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\&quot;#../concepts/context-collapse\&quot;&gt;context collapse&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\&quot;#../concepts/evaluation-monitoring-scale\&quot;&gt;evaluation monitoring scale&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;&quot;},{&quot;slug&quot;:&quot;wiki/sources/2607.23809-agentic-context-management&quot;,&quot;title&quot;:&quot;ACM: Agentic Context Management for Long Horizon Tasks&quot;,&quot;group&quot;:&quot;Wiki&quot;,&quot;section&quot;:&quot;wiki/sources&quot;,&quot;markdown&quot;:&quot;\n# ACM: Agentic Context Management\n\n## Citation\n\nXiaochuan Li et al. \&quot;ACM: Agentic Context Management for Long Horizon Tasks.\&quot; arXiv:2607.23809, submitted 2026-07-26.\n\n## Core Claim\n\nACM equips agents with context-editing tools so the agent can decide when to compress active context, offload raw messages to external memory, and retrieve them later.\n\n## Method\n\nACM introduces two tools:\n\n- `manage_context`: compresses previous turns into a concise summary and stores the raw messages externally.\n- `query_memory`: retrieves information from the raw stored messages using the summary identifier.\n\nThe key distinction from a summary-only agent is that raw content is preserved outside the active prompt, and the agent initiates context management based on its reasoning state rather than a fixed usage threshold.\n\n## Evaluation Notes\n\nThe paper evaluates agentic search and coding tasks. It reports that context management reduces peak token pressure, allows longer exploration, and improves consistency across independent trials. The abstract says the post-training pipeline improves Qwen3.5-9B search and coding performance over ReAct; detailed benchmark tables should be consulted before quoting exact numbers.\n\n## Limitations\n\nThe authors state ACM presupposes strong long-horizon reasoning and tool-use ability; weaker models may fail or hallucinate too early to benefit from compression. The paper is fresh and should be treated as credible but not yet broadly validated.\n\n## Wiki Links\n\n- [[../concepts/agentic-context-management]]\n- [[../concepts/evaluation-monitoring-scale]]\n\n&quot;,&quot;html&quot;:&quot;&lt;h1&gt;ACM: Agentic Context Management&lt;/h1&gt;\n&lt;h2&gt;Citation&lt;/h2&gt;\n&lt;p&gt;Xiaochuan Li et al. &amp;quot;ACM: Agentic Context Management for Long Horizon Tasks.&amp;quot; arXiv:2607.23809, submitted 2026-07-26.&lt;/p&gt;\n&lt;h2&gt;Core Claim&lt;/h2&gt;\n&lt;p&gt;ACM equips agents with context-editing tools so the agent can decide when to compress active context, offload raw messages to external memory, and retrieve them later.&lt;/p&gt;\n&lt;h2&gt;Method&lt;/h2&gt;\n&lt;p&gt;ACM introduces two tools:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;manage_context&lt;/code&gt;: compresses previous turns into a concise summary and stores the raw messages externally.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;query_memory&lt;/code&gt;: retrieves information from the raw stored messages using the summary identifier.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The key distinction from a summary-only agent is that raw content is preserved outside the active prompt, and the agent initiates context management based on its reasoning state rather than a fixed usage threshold.&lt;/p&gt;\n&lt;h2&gt;Evaluation Notes&lt;/h2&gt;\n&lt;p&gt;The paper evaluates agentic search and coding tasks. It reports that context management reduces peak token pressure, allows longer exploration, and improves consistency across independent trials. The abstract says the post-training pipeline improves Qwen3.5-9B search and coding performance over ReAct; detailed benchmark tables should be consulted before quoting exact numbers.&lt;/p&gt;\n&lt;h2&gt;Limitations&lt;/h2&gt;\n&lt;p&gt;The authors state ACM presupposes strong long-horizon reasoning and tool-use ability; weaker models may fail or hallucinate too early to benefit from compression. The paper is fresh and should be treated as credible but not yet broadly validated.&lt;/p&gt;\n&lt;h2&gt;Wiki Links&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\&quot;#../concepts/agentic-context-management\&quot;&gt;agentic context management&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\&quot;#../concepts/evaluation-monitoring-scale\&quot;&gt;evaluation monitoring scale&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;&quot;},{&quot;slug&quot;:&quot;wiki/sources/2607.25066-addressable-recall-compaction&quot;,&quot;title&quot;:&quot;Addressable Recall Compaction for Long Context-Window Control in AI Agents&quot;,&quot;group&quot;:&quot;Wiki&quot;,&quot;section&quot;:&quot;wiki/sources&quot;,&quot;markdown&quot;:&quot;\n# Addressable Recall Compaction\n\n## Citation\n\nYuma Ichikawa et al. \&quot;Addressable Recall Compaction for Long Context-Window Control in AI Agents.\&quot; arXiv:2607.25066, submitted 2026-07-27.\n\n## Core Claim\n\nARC separates archival storage from active-context presentation. Tool observations are stored verbatim in an append-only, addressable store; the active context keeps compact citations that can be dereferenced with recall tools.\n\n## Method\n\n- Store each tool observation under a stable content-derived identifier.\n- Replace older or longer observations in the active transcript with citation stubs containing previews, metadata, and recall hints.\n- Let the agent explicitly recall `§id` entries when exact prior content matters.\n\nThis differs from RAG memory because recovery is address-based rather than similarity-dependent.\n\n## Evaluation Notes\n\nThe paper reports:\n\n- Needle-in-Haystack exact-answer accuracy: 99.40% for ARC versus 88.12% for the best evaluated baseline.\n- LongBench-v2 Hard average accuracy: 29.97% for ARC versus 28.25% for the best evaluated baseline.\n- Lower estimated serving time and HBM traffic under the paper&#39;s hardware-cost model.\n\nThese claims are for the tested Qwen3-8B/32B settings and should not be generalized to all retrieval or compression systems.\n\n## Limitations\n\nThe authors note the margin narrows on LongBench-v2 because those tasks require synthesis, not just exact recall. Open questions include token overhead, generalization beyond Qwen3 models, and broader model/context-window grids.\n\n## Wiki Links\n\n- [[../concepts/addressable-recall-compaction]]\n- [[../concepts/evaluation-monitoring-scale]]\n\n&quot;,&quot;html&quot;:&quot;&lt;h1&gt;Addressable Recall Compaction&lt;/h1&gt;\n&lt;h2&gt;Citation&lt;/h2&gt;\n&lt;p&gt;Yuma Ichikawa et al. &amp;quot;Addressable Recall Compaction for Long Context-Window Control in AI Agents.&amp;quot; arXiv:2607.25066, submitted 2026-07-27.&lt;/p&gt;\n&lt;h2&gt;Core Claim&lt;/h2&gt;\n&lt;p&gt;ARC separates archival storage from active-context presentation. Tool observations are stored verbatim in an append-only, addressable store; the active context keeps compact citations that can be dereferenced with recall tools.&lt;/p&gt;\n&lt;h2&gt;Method&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Store each tool observation under a stable content-derived identifier.&lt;/li&gt;\n&lt;li&gt;Replace older or longer observations in the active transcript with citation stubs containing previews, metadata, and recall hints.&lt;/li&gt;\n&lt;li&gt;Let the agent explicitly recall &lt;code&gt;§id&lt;/code&gt; entries when exact prior content matters.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;This differs from RAG memory because recovery is address-based rather than similarity-dependent.&lt;/p&gt;\n&lt;h2&gt;Evaluation Notes&lt;/h2&gt;\n&lt;p&gt;The paper reports:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Needle-in-Haystack exact-answer accuracy: 99.40% for ARC versus 88.12% for the best evaluated baseline.&lt;/li&gt;\n&lt;li&gt;LongBench-v2 Hard average accuracy: 29.97% for ARC versus 28.25% for the best evaluated baseline.&lt;/li&gt;\n&lt;li&gt;Lower estimated serving time and HBM traffic under the paper&amp;#39;s hardware-cost model.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;These claims are for the tested Qwen3-8B/32B settings and should not be generalized to all retrieval or compression systems.&lt;/p&gt;\n&lt;h2&gt;Limitations&lt;/h2&gt;\n&lt;p&gt;The authors note the margin narrows on LongBench-v2 because those tasks require synthesis, not just exact recall. Open questions include token overhead, generalization beyond Qwen3 models, and broader model/context-window grids.&lt;/p&gt;\n&lt;h2&gt;Wiki Links&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\&quot;#../concepts/addressable-recall-compaction\&quot;&gt;addressable recall compaction&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\&quot;#../concepts/evaluation-monitoring-scale\&quot;&gt;evaluation monitoring scale&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;&quot;},{&quot;slug&quot;:&quot;wiki/sources/bright-leaderboard-top-methods&quot;,&quot;title&quot;:&quot;BRIGHT Leaderboard Top Methods&quot;,&quot;group&quot;:&quot;Wiki&quot;,&quot;section&quot;:&quot;wiki/sources&quot;,&quot;markdown&quot;:&quot;\n# BRIGHT Leaderboard Top Methods\n\nThis source page records a 2026-08-16 snapshot of the leading BRIGHT methods and the primary sources used for the deep dive. The leaderboard and project pages are live web sources; scores may change.\n\n## Top Short-Document Methods Checked\n\n| Rank | Method | Short Score | Date | Primary Source Type |\n|---|---:|---:|---|---|\n| 1 | Mira-Reasoning-Retrieval | 66.9 | 2026-04-22 | project page/model cards |\n| 2 | INF-X-Retriever | 63.4 | 2025-12-20 | project page/repo/model cards |\n| 3 | RakanEmbed4B | 52.4 | 2026-03-20 | project page |\n| 4 | NVIDIA NeMo Retriever Agentic Retrieval | 50.9 | 2026-03-13 | GitHub submission/model card |\n| 5 | DIVER-v3-GroupRank | 46.8 | 2025-11-13 | arXiv paper/repo/model cards |\n| 6 | BGE-Reasoner-0928 | 46.4 | 2025-10-13 | GitHub repo/arXiv papers/model cards |\n\n## Evidence Quality Notes\n\n- DIVER, ReasonEmbed, Retro*, and ReasonRank have arXiv papers; ReasonEmbed and ReasonRank report ACL 2026 acceptance.\n- Mira and INF-X are high-scoring but mostly documented through project pages, repos, and Hugging Face cards, not peer-reviewed papers found in this pass.\n- RakanEmbed has the thinnest public detail among top methods checked.\n- NVIDIA NeMo is well documented in a GitHub submission but depends on a commercial LLM in an agent loop, which affects cost/reproducibility.\n\n&quot;,&quot;html&quot;:&quot;&lt;h1&gt;BRIGHT Leaderboard Top Methods&lt;/h1&gt;\n&lt;p&gt;This source page records a 2026-08-16 snapshot of the leading BRIGHT methods and the primary sources used for the deep dive. The leaderboard and project pages are live web sources; scores may change.&lt;/p&gt;\n&lt;h2&gt;Top Short-Document Methods Checked&lt;/h2&gt;\n&lt;p&gt;| Rank | Method | Short Score | Date | Primary Source Type |&lt;/p&gt;\n&lt;p&gt;|---|---:|---:|---|---|&lt;/p&gt;\n&lt;p&gt;| 1 | Mira-Reasoning-Retrieval | 66.9 | 2026-04-22 | project page/model cards |&lt;/p&gt;\n&lt;p&gt;| 2 | INF-X-Retriever | 63.4 | 2025-12-20 | project page/repo/model cards |&lt;/p&gt;\n&lt;p&gt;| 3 | RakanEmbed4B | 52.4 | 2026-03-20 | project page |&lt;/p&gt;\n&lt;p&gt;| 4 | NVIDIA NeMo Retriever Agentic Retrieval | 50.9 | 2026-03-13 | GitHub submission/model card |&lt;/p&gt;\n&lt;p&gt;| 5 | DIVER-v3-GroupRank | 46.8 | 2025-11-13 | arXiv paper/repo/model cards |&lt;/p&gt;\n&lt;p&gt;| 6 | BGE-Reasoner-0928 | 46.4 | 2025-10-13 | GitHub repo/arXiv papers/model cards |&lt;/p&gt;\n&lt;h2&gt;Evidence Quality Notes&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;DIVER, ReasonEmbed, Retro*, and ReasonRank have arXiv papers; ReasonEmbed and ReasonRank report ACL 2026 acceptance.&lt;/li&gt;\n&lt;li&gt;Mira and INF-X are high-scoring but mostly documented through project pages, repos, and Hugging Face cards, not peer-reviewed papers found in this pass.&lt;/li&gt;\n&lt;li&gt;RakanEmbed has the thinnest public detail among top methods checked.&lt;/li&gt;\n&lt;li&gt;NVIDIA NeMo is well documented in a GitHub submission but depends on a commercial LLM in an agent loop, which affects cost/reproducibility.&lt;/li&gt;\n&lt;/ul&gt;&quot;},{&quot;slug&quot;:&quot;wiki/sources/karpathy-llm-wiki-gist&quot;,&quot;title&quot;:&quot;llm-wiki&quot;,&quot;group&quot;:&quot;Wiki&quot;,&quot;section&quot;:&quot;wiki/sources&quot;,&quot;markdown&quot;:&quot;\n# Karpathy LLM Wiki Gist\n\nKarpathy&#39;s pattern argues for a persistent Markdown wiki between raw sources and Q&amp;A. The LLM ingests sources once, compiles durable synthesis into interlinked pages, flags contradictions, and updates the wiki as new sources arrive.\n\nThis project follows that pattern:\n\n- `raw/` is source truth.\n- `wiki/` is maintained synthesis.\n- `AGENTS.md` is the schema and operating manual.\n- `wiki/index.md` and `wiki/log.md` are the navigation and audit spine.\n\n&quot;,&quot;html&quot;:&quot;&lt;h1&gt;Karpathy LLM Wiki Gist&lt;/h1&gt;\n&lt;p&gt;Karpathy&amp;#39;s pattern argues for a persistent Markdown wiki between raw sources and Q&amp;amp;A. The LLM ingests sources once, compiles durable synthesis into interlinked pages, flags contradictions, and updates the wiki as new sources arrive.&lt;/p&gt;\n&lt;p&gt;This project follows that pattern:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;raw/&lt;/code&gt; is source truth.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;wiki/&lt;/code&gt; is maintained synthesis.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;AGENTS.md&lt;/code&gt; is the schema and operating manual.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;wiki/index.md&lt;/code&gt; and &lt;code&gt;wiki/log.md&lt;/code&gt; are the navigation and audit spine.&lt;/li&gt;\n&lt;/ul&gt;&quot;},{&quot;slug&quot;:&quot;wiki/sources/langchain-context-engineering-docs&quot;,&quot;title&quot;:&quot;Context engineering in agents&quot;,&quot;group&quot;:&quot;Wiki&quot;,&quot;section&quot;:&quot;wiki/sources&quot;,&quot;markdown&quot;:&quot;\n# LangChain Context Engineering Docs\n\nLangChain defines context engineering as providing the right information and tools in the right format so an LLM can accomplish a task. The docs separate context into model context, tool context, and lifecycle context, and distinguish transient state from persistent store.\n\nRelevance to ACE: this is practitioner framing rather than ACE validation, but it gives a useful production vocabulary for monitoring where context enters, mutates, persists, and affects behavior.\n\n&quot;,&quot;html&quot;:&quot;&lt;h1&gt;LangChain Context Engineering Docs&lt;/h1&gt;\n&lt;p&gt;LangChain defines context engineering as providing the right information and tools in the right format so an LLM can accomplish a task. The docs separate context into model context, tool context, and lifecycle context, and distinguish transient state from persistent store.&lt;/p&gt;\n&lt;p&gt;Relevance to ACE: this is practitioner framing rather than ACE validation, but it gives a useful production vocabulary for monitoring where context enters, mutates, persists, and affects behavior.&lt;/p&gt;&quot;},{&quot;slug&quot;:&quot;wiki/sources/sambanova-ace-open-sourced&quot;,&quot;title&quot;:&quot;Your Agents Just Got a Memory Upgrade: ACE Open-Sourced on GitHub&quot;,&quot;group&quot;:&quot;Wiki&quot;,&quot;section&quot;:&quot;wiki/sources&quot;,&quot;markdown&quot;:&quot;\n# SambaNova ACE Open-Source Announcement\n\nSambaNova&#39;s post announces an ACE implementation with Generator, Reflector, Curator components and scripts for Finance and AppWorld benchmarks. It repeats headline paper claims such as +10.6% on agentic benchmarks and +8.6% on domain-specific benchmarks.\n\nTreat this as an official implementation/announcement source, not independent validation. Benchmark claims should still cite the paper.\n\n&quot;,&quot;html&quot;:&quot;&lt;h1&gt;SambaNova ACE Open-Source Announcement&lt;/h1&gt;\n&lt;p&gt;SambaNova&amp;#39;s post announces an ACE implementation with Generator, Reflector, Curator components and scripts for Finance and AppWorld benchmarks. It repeats headline paper claims such as +10.6% on agentic benchmarks and +8.6% on domain-specific benchmarks.&lt;/p&gt;\n&lt;p&gt;Treat this as an official implementation/announcement source, not independent validation. Benchmark claims should still cite the paper.&lt;/p&gt;&quot;},{&quot;slug&quot;:&quot;reports/latest-interesting&quot;,&quot;title&quot;:&quot;Latest Interesting Items&quot;,&quot;group&quot;:&quot;Reports&quot;,&quot;section&quot;:&quot;reports/latest-interesting&quot;,&quot;markdown&quot;:&quot;# Latest Interesting Items\n\nUpdated: 2026-08-16\n\n## Seed Findings\n\n- **ACE is the center of gravity.** arXiv:2510.04618 frames context as an evolving playbook and reports strong AppWorld and finance gains under tested settings.\n- **ACM is worth watching.** arXiv:2607.23809 moves context management into the agent action loop with explicit `manage_context` and `query_memory` tools.\n- **ARC adds a missing primitive.** arXiv:2607.25066 makes prior tool observations addressable, which may complement ACE by preserving exact evidence while ACE curates lessons.\n- **BRIGHT is the best evaluation lead so far.** arXiv:2407.12883 is not an ACE benchmark, but its reasoning-intensive retrieval tasks are a natural place to test whether ACE-style playbooks learn better query strategies and whether ACM/ARC preserve long search traces.\n- **BRIGHT leaderboard pattern:** top methods tend to transform query intent before retrieval, then use reasoning-tuned dense retrievers, reranking/fusion, or agentic multi-query search. Mira-Reasoning-Retrieval and INF-X lead the checked snapshot.\n\n## Skeptical Notes\n\n- Do not call any of these a solved memory architecture.\n- The str
