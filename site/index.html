ongest claims are benchmark-specific.\n- Fresh preprints need replication and production evidence.\n- \&quot;Lossless storage\&quot; is not the same as \&quot;the agent reliably uses the right stored item.\&quot;\n- Several BRIGHT leaderboard method descriptions are self-reported through project pages/model cards rather than peer-reviewed papers.\n&quot;,&quot;html&quot;:&quot;&lt;h1&gt;Latest Interesting Items&lt;/h1&gt;\n&lt;p&gt;Updated: 2026-08-16&lt;/p&gt;\n&lt;h2&gt;Seed Findings&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;ACE is the center of gravity.&lt;/strong&gt; arXiv:2510.04618 frames context as an evolving playbook and reports strong AppWorld and finance gains under tested settings.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;ACM is worth watching.&lt;/strong&gt; arXiv:2607.23809 moves context management into the agent action loop with explicit &lt;code&gt;manage_context&lt;/code&gt; and &lt;code&gt;query_memory&lt;/code&gt; tools.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;ARC adds a missing primitive.&lt;/strong&gt; arXiv:2607.25066 makes prior tool observations addressable, which may complement ACE by preserving exact evidence while ACE curates lessons.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;BRIGHT is the best evaluation lead so far.&lt;/strong&gt; arXiv:2407.12883 is not an ACE benchmark, but its reasoning-intensive retrieval tasks are a natural place to test whether ACE-style playbooks learn better query strategies and whether ACM/ARC preserve long search traces.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;BRIGHT leaderboard pattern:&lt;/strong&gt; top methods tend to transform query intent before retrieval, then use reasoning-tuned dense retrievers, reranking/fusion, or agentic multi-query search. Mira-Reasoning-Retrieval and INF-X lead the checked snapshot.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2&gt;Skeptical Notes&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Do not call any of these a solved memory architecture.&lt;/li&gt;\n&lt;li&gt;The strongest claims are benchmark-specific.&lt;/li&gt;\n&lt;li&gt;Fresh preprints need replication and production evidence.&lt;/li&gt;\n&lt;li&gt;&amp;quot;Lossless storage&amp;quot; is not the same as &amp;quot;the agent reliably uses the right stored item.&amp;quot;&lt;/li&gt;\n&lt;li&gt;Several BRIGHT leaderboard method descriptions are self-reported through project pages/model cards rather than peer-reviewed papers.&lt;/li&gt;\n&lt;/ul&gt;&quot;},{&quot;slug&quot;:&quot;reports/runs/README&quot;,&quot;title&quot;:&quot;Monitor Run Reports&quot;,&quot;group&quot;:&quot;Reports&quot;,&quot;section&quot;:&quot;reports/runs&quot;,&quot;markdown&quot;:&quot;# Monitor Run Reports\n\nEach twice-daily monitor run writes a dated report here so James can review the activity and decisions behind the wiki updates and alerts.\n\nExpected format:\n\n- Searches performed.\n- Candidate sources found.\n- Sources accepted, rejected, or deferred.\n- Files changed.\n- Decisions made and why.\n- Skeptical review notes.\n- Follow-ups.\n\n&quot;,&quot;html&quot;:&quot;&lt;h1&gt;Monitor Run Reports&lt;/h1&gt;\n&lt;p&gt;Each twice-daily monitor run writes a dated report here so James can review the activity and decisions behind the wiki updates and alerts.&lt;/p&gt;\n&lt;p&gt;Expected format:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Searches performed.&lt;/li&gt;\n&lt;li&gt;Candidate sources found.&lt;/li&gt;\n&lt;li&gt;Sources accepted, rejected, or deferred.&lt;/li&gt;\n&lt;li&gt;Files changed.&lt;/li&gt;\n&lt;li&gt;Decisions made and why.&lt;/li&gt;\n&lt;li&gt;Skeptical review notes.&lt;/li&gt;\n&lt;li&gt;Follow-ups.&lt;/li&gt;\n&lt;/ul&gt;&quot;}]">
      <article id="content"></article>
    </main>
  </div>
  <script>
    const app = document.getElementById('app');
    const pages = JSON.parse(app.dataset.pages);
    const nav = document.getElementById('nav');
    const content = document.getElementById('content');
    const search = document.getElementById('search');

    function label(section) {
      return section.split('/').map((part) => part.replaceAll('-', ' ')).join(' / ');
    }

    function targetSlug(raw) {
      const clean = raw.replace(/^#/, '').replace(/\.md$/, '');
      const exact = pages.find((page) => page.slug === clean);
      if (exact) return exact.slug;
      const wiki = pages.find((page) => page.slug === 'wiki/' + clean);
      if (wiki) return wiki.slug;
      const byTail = pages.find((page) => page.slug.endsWith('/' + clean));
      return byTail ? byTail.slug : clean;
    }

    function renderNav(filter = '') {
      const q = filter.trim().toLowerCase();
      const visible = pages.filter((page) => !q || (page.title + ' ' + page.markdown + ' ' + page.slug).toLowerCase().includes(q));
      nav.innerHTML = '';
      if (!visible.length) {
        nav.innerHTML = '<div class="empty">No matches</div>';
        return;
      }
      const groups = new Map();
      for (const page of visible) {
        const key = page.section;
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(page);
      }
      for (const [group, items] of groups) {
        const header = document.createElement('div');
        header.className = 'nav-group';
        header.textContent = label(group);
        nav.appendChild(header);
        for (const page of items.sort((a, b) => a.title.localeCompare(b.title))) {
          const button = document.createElement('button');
          button.className = 'nav-item';
          button.dataset.slug = page.slug;
          button.textContent = page.title;
          button.addEventListener('click', () => openPage(page.slug));
          nav.appendChild(button);
        }
      }
      markActive();
    }

    function markActive() {
      const active = location.hash.slice(1) || 'wiki/index';
      document.querySelectorAll('.nav-item').forEach((item) => {
        item.classList.toggle('active', item.dataset.slug === active);
      });
    }

    function openPage(slug) {
      const resolved = targetSlug(slug);
      const page = pages.find((item) => item.slug === resolved) || pages.find((item) => item.slug === 'wiki/index') || pages[0];
      location.hash = page.slug;
      content.innerHTML = page.html;
      content.querySelectorAll('a[href^="#"]').forEach((link) => {
        link.addEventListener('click', (event) => {
          event.preventDefault();
          openPage(link.getAttribute('href'));
        });
      });
      document.title = page.title + ' - ACE Context Research Viewer';
      markActive();
    }

    search.addEventListener('input', () => renderNav(search.value));
    window.addEventListener('hashchange', () => openPage(location.hash.slice(1)));

    pages.sort((a, b) => a.slug.localeCompare(b.slug));
    renderNav();
    openPage(location.hash.slice(1) || 'wiki/index');
  </script>
